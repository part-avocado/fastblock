name: Update blocklist

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily, after upstream lists typically refresh
  workflow_dispatch:       # allow manual trigger from the Actions UI
  push:
    branches: [main]
    paths:
      - sources.txt
      - allowlist.txt
      - build.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build hosts file
        run: python build.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet hosts || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts
          git commit -m "chore: update hosts file $(date -u +%Y-%m-%d)"
          git push
